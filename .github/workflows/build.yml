
name: Build TH The Last Ward

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq tar

      - name: Download official PS3DEV release
        run: |
          URL=$(curl -fsSL https://api.github.com/repos/ps3dev/ps3dev/releases/latest | jq -r '[.assets[] | select(.name | test("ubuntu.*tar.gz"; "i"))][0].browser_download_url')

          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "No se encontró el archivo de PS3DEV para Ubuntu."
            exit 1
          fi

          echo "Descargando: $URL"
          curl -fL "$URL" -o ps3dev.tar.gz

      - name: Install PS3DEV
        run: |
          sudo mkdir -p /usr/local/ps3dev
          sudo tar -xzf ps3dev.tar.gz -C /usr/local/ps3dev

          echo "PS3DEV=/usr/local/ps3dev" >> $GITHUB_ENV
          echo "PSL1GHT=/usr/local/ps3dev" >> $GITHUB_ENV

          echo "/usr/local/ps3dev/bin" >> $GITHUB_PATH
          echo "/usr/local/ps3dev/ppu/bin" >> $GITHUB_PATH
          echo "/usr/local/ps3dev/spu/bin" >> $GITHUB_PATH

      - name: Verify PS3 compiler
        run: |
          find /usr/local/ps3dev -name ppu-gcc -print
          ppu-gcc --version

      - name: Compile game
        run: |
          make clean
          make

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: TH-The-Last-Ward-ELF
          path: THTheLastWard.elf
          if-no-files-found: error
