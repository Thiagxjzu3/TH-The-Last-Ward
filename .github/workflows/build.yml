
name: Build TH The Last Ward

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl tar

      - name: Download PS3DEV
        run: |
          curl -fL \
            "https://github.com/ps3dev/ps3dev/releases/download/nightly-2026-11-16/ps3dev-linux-X64.tar.gz" \
            -o ps3dev.tar.gz

      - name: Extract PS3DEV
        run: |
          mkdir -p "$RUNNER_TEMP/ps3dev"
          tar -xzf ps3dev.tar.gz -C "$RUNNER_TEMP/ps3dev"

      - name: Configure PS3 environment
        run: |
          PPU_GCC=$(find "$RUNNER_TEMP/ps3dev" -name ppu-gcc -print -quit)
          PPU_RULES=$(find "$RUNNER_TEMP/ps3dev" -name ppu_rules -print -quit)

          if [ -z "$PPU_GCC" ]; then
            echo "ERROR: No se encontró ppu-gcc"
            exit 1
          fi

          if [ -z "$PPU_RULES" ]; then
            echo "ERROR: No se encontró ppu_rules"
            exit 1
          fi

          PPU_BIN=$(dirname "$PPU_GCC")
          PS3DEV=$(dirname "$(dirname "$PPU_BIN")")
          PSL1GHT=$(dirname "$PPU_RULES")

          echo "PS3DEV=$PS3DEV" >> "$GITHUB_ENV"
          echo "PSL1GHT=$PSL1GHT" >> "$GITHUB_ENV"

          echo "$PS3DEV/bin" >> "$GITHUB_PATH"
          echo "$PS3DEV/ppu/bin" >> "$GITHUB_PATH"
          echo "$PS3DEV/spu/bin" >> "$GITHUB_PATH"

      - name: Verify PS3 environment
        run: |
          echo "PS3DEV=$PS3DEV"
          echo "PSL1GHT=$PSL1GHT"
          ppu-gcc --version
          test -f "$PSL1GHT/ppu_rules"
          echo "PS3DEV instalado correctamente."
